# =============================================================================
# Sveltia CMS 配置（Netlify/Decap CMS 兼容格式）
# 字段与 Fuwari 的 src/content/config.ts 里的 Zod schema 严格对齐，
# 修改本文件前请先读那个文件，否则保存出来的 md 会让 `pnpm build` 失败。
#
# Fuwari 的 frontmatter schema（src/content/config.ts）：
#   title: string（必填）
#   published: Date（必填，写作 2023-09-09 这种 YYYY-MM-DD 纯量）
#   updated: Date（可选）
#   draft: boolean（可选，默认 false）
#   description: string（可选，默认 ""）
#   image: string（可选，默认 ""）
#   tags: string[]（可选，默认 []）
#   category: string | null（可选，默认 ""）
#   lang: string（可选，默认 ""）
# =============================================================================

backend:
  name: github
  repo: sdhkj/sdhkj.github.io
  branch: main
  # 只用「访问令牌（GitHub Personal Access Token）」登录，不需要任何 OAuth 中转服务：
  # 这里既没有 base_url，也没有 auth_scope —— 那两个选项只跟 OAuth 有关，现在用不到了。
  #
  # 登录流程：打开 /admin → 点 “Sign In with Token” → 弹窗里会给出一条已经预选好权限的
  # GitHub 令牌生成链接，生成后把令牌粘贴回弹窗即可。
  #
  # 令牌只保存在你当前浏览器的 localStorage 里：不会写进仓库，也不经过任何第三方服务器
  # （Sveltia 是浏览器直接调用 GitHub 的 API）。
  #
  # 以后想改回 OAuth 一键登录时，把这一行换成 auth_methods: [oauth, token]（或整行删掉，
  # 默认两种都允许），并补上 base_url —— 完整步骤见根目录 README.md 第 5 节。
  auth_methods: [token]

# 本地写作开关。
# 注意：Sveltia CMS 已放弃 Decap 的代理式本地后端（源码里 local_backend 被标记为
# unsupported 并被忽略，打开 /admin 时只会提示该选项无效）。这里保留它是为了兼容
# 习惯 Decap 配置的读者；真正生效的本地写作方式是 /admin 页面上的
# “Work with Local Repository” 按钮（Chromium 的 File System Access API），
# 具体步骤见根目录 README.md 的「本地写作」一节。
local_backend: true

publish_mode: simple

# 关键：省略空的可选字段。
# 默认值是 false，此时留空的 `updated` 会被写成 `updated: ''`，
# 而 Astro 的 z.date() 不接受空字符串，构建会直接报错。必须保持 true。
output:
  omit_empty_optional_fields: true
  yaml:
    indent_size: 2
    quote: none

# 图片上传到 Fuwari 的 public/ 目录，frontmatter 里写成 /images/xxx.png。
# Fuwari 把以 "/" 开头的 image 当作 public 路径处理（见 src/components/misc/ImageWrapper.astro）。
# 注意 media_folder 相对仓库根目录，public_folder 是站点上的绝对路径。
media_folder: public/images
public_folder: /images

# 全局 slug（文件名）规则。
# encoding: unicode 会保留中文，中文标题生成中文文件名（可正常构建、也能被 Git 跟踪）；
# 若改成 ascii，纯中文标题会被清空并退化成随机 UUID，不建议。
slug:
  encoding: unicode
  clean_accents: false
  sanitize_replacement: "-"
  trim: true

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    description: 博客文章，写入 src/content/posts/<文件名>.md
    folder: src/content/posts
    create: true
    delete: true
    extension: md
    format: frontmatter
    # 文件名模板：src/content/posts/{{slug}}.md，新建时可在编辑器侧栏手动改
    path: "{{slug}}"
    slug: "{{slug}}"
    identifier_field: title
    # Astro 的路由是 /posts/<文件名>/（trailingSlash: always）
    preview_path: "posts/{{slug}}/"
    summary: "{{title}} — {{published}}"
    sortable_fields: [published, title]
    view_filters:
      - label: 仅草稿
        field: draft
        pattern: true
    fields:
      - label: 标题
        name: title
        widget: string

      - label: 发布日期
        name: published
        widget: datetime
        # 只取日期，并保证写成 `published: 2023-09-09`（不加引号），
        # 与 Fuwari 示例文章一致，Astro 的 yaml 解析会得到 Date。
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
        picker_utc: true

      - label: 更新日期
        name: updated
        widget: datetime
        required: false
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
        picker_utc: true
        hint: 留空即可；留空时不会写入 frontmatter（依赖上面的 output.omit_empty_optional_fields）

      - label: 摘要
        name: description
        widget: text
        required: false
        default: ""
        hint: 显示在文章列表和 SEO 描述里

      - label: 封面图
        name: image
        widget: image
        required: false
        default: ""
        hint: 上传后写入 /images/<文件名>；留空则不显示封面

      - label: 标签
        name: tags
        widget: list
        required: false
        default: []

      - label: 分类
        name: category
        widget: string
        required: false
        default: ""

      - label: 草稿
        name: draft
        widget: boolean
        required: false
        default: false
        hint: 勾选后文章仍会构建，但默认在草稿状态（Fuwari 首页会隐藏草稿）

      - label: 语言
        name: lang
        widget: string
        required: false
        default: ""
        hint: 例如 zh_CN / en；留空则使用站点默认语言

      # 正文。Sveltia 默认把名为 body 的 markdown 字段作为正文（不写进 frontmatter），
      # 因此必须保持 name: body，且不需要在 frontmatter 里出现。
      - label: 正文
        name: body
        widget: markdown

  # 关于页：src/content/spec/about.md（Fuwari 的 spec 集合没有 frontmatter schema）
  - name: pages
    label: 页面
    files:
      - name: about
        label: 关于
        file: src/content/spec/about.md
        fields:
          - label: 正文
            name: body
            widget: markdown

  # 站点设置：src/site-config.json
  # 这个 JSON 被 src/config.ts import 后合并进 siteConfig / navBarConfig / profileConfig。
  # 字段名必须和那个 JSON 的 key 完全一致，输出格式固定为 json（2 空格缩进），
  # 数字类型用 value_type: int，否则会被写成字符串导致 hue 失效。
  - name: settings
    label: 站点设置
    files:
      - name: site
        label: 站点信息
        file: src/site-config.json
        format: json
        description: 改完保存，等一次自动部署（1～3 分钟）即可生效
        fields:
          - label: 站点标题
            name: title
            widget: string
            hint: 显示在导航栏、浏览器标签页、RSS 标题里

          - label: 副标题 / 签名
            name: subtitle
            widget: string
            hint: 首页浏览器标题里显示为「站点标题 - 副标题」

          - label: 作者名 / 页脚版权名
            name: authorName
            widget: string
            hint: 同时用于侧栏名字、页脚版权、meta author、RSS 标题

          - label: 侧栏个人简介
            name: bio
            widget: string
            required: false
            hint: 头像下方那行小字

          - label: 头像
            name: avatar
            widget: image
            required: false
            hint: 可以直接粘贴外链，例如 https://github.com/sdhkj.png；上传则会存到 /images/ 下

          - label: 主题色 Hue
            name: themeColorHue
            widget: number
            value_type: int
            min: 0
            max: 360
            default: 250
            hint: 0～360。红 0、青 200、蓝紫 250、粉 345；默认 250

          - label: 导航栏 GitHub 链接
            name: githubUrl
            widget: string
            hint: 也用作侧栏的 GitHub 图标链接

