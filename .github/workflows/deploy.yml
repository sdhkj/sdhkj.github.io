name: Deploy to GitHub Pages

# 推送到 main 后自动构建并发布到 GitHub Pages。
# 首次使用需要：仓库 Settings → Pages → Source 选择 "GitHub Actions"。
on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages 官方推荐的权限组合
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，避免并发写 Pages
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build site
        # package.json 的 prebuild 会先把 @sveltia/cms 的脚本同步到 public/admin/
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
